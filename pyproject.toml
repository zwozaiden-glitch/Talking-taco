[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talkingtaco"
version = "1.0.0"
description = "An AI-powered Discord chat bot with a pluggable provider layer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.4,<3.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
talkingtaco = "talkingtaco.__main__:main"

[tool.setuptools.packages.find]
include = ["talkingtaco*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
